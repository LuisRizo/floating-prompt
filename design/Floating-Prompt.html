<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Floating-Prompt — UI design</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
    #root { width: 100%; height: 100%; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="palettes.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="popup.jsx"></script>
  <script type="text/babel" src="artboards.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect } = React;

const POPUP_W = 580;  // artboard width — popup is 520, +30 margin each side

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="states"
        title="Floating-Prompt"
        subtitle="A quiet, on-top popup for synchronous turns with Claude Code. Seven canonical states, plus interaction details and per-project palettes."
      >
        <DCArtboard id="stop-short"   label="Stop · short reply"           width={POPUP_W} height={330}><ArtStopShort /></DCArtboard>
        <DCArtboard id="stop-long"    label="Stop · multi-paragraph (scrollable)"  width={POPUP_W} height={620}><ArtStopLong /></DCArtboard>
        <DCArtboard id="q-short"      label="AskUserQuestion · 3 short options"    width={POPUP_W} height={430}><ArtQ3Short /></DCArtboard>
        <DCArtboard id="q-long"       label="AskUserQuestion · sentence options, queue 3"  width={POPUP_W} height={500}><ArtQ3LongQueued /></DCArtboard>
        <DCArtboard id="multi"        label="AskUserQuestion · multi-select, 4 options"    width={POPUP_W} height={470}><ArtMulti4 /></DCArtboard>
        <DCArtboard id="preview"      label="AskUserQuestion · with previews"      width={POPUP_W} height={530}><ArtPreview /></DCArtboard>
        <DCArtboard id="plan"         label="ExitPlanMode · plan + Approve"        width={POPUP_W} height={680}><ArtPlan /></DCArtboard>
      </DCSection>

      <DCSection
        id="palettes"
        title="Palette family"
        subtitle="Six dark palettes assigned per-project via the /floating-prompt skill. Each palette resolves the same slot schema — bg, panel, accent, option surface, body, dim, scrollThumb — so no color is hard-coded into the popup."
      >
        <DCArtboard id="pal-slate"   label="slate · default"     width={POPUP_W} height={440}><ArtPalette palette={FP_PALETTES.slate} /></DCArtboard>
        <DCArtboard id="pal-ocean"   label="ocean"               width={POPUP_W} height={440}><ArtPalette palette={FP_PALETTES.ocean} /></DCArtboard>
        <DCArtboard id="pal-amber"   label="amber"               width={POPUP_W} height={440}><ArtPalette palette={FP_PALETTES.amber} /></DCArtboard>
        <DCArtboard id="pal-forest"  label="forest"              width={POPUP_W} height={440}><ArtPalette palette={FP_PALETTES.forest} /></DCArtboard>
        <DCArtboard id="pal-plum"    label="plum"                width={POPUP_W} height={440}><ArtPalette palette={FP_PALETTES.plum} /></DCArtboard>
        <DCArtboard id="pal-default" label="default · neutral"   width={POPUP_W} height={440}><ArtPalette palette={FP_PALETTES.default} /></DCArtboard>
      </DCSection>

      <DCSection
        id="interactions"
        title="Interaction states"
        subtitle="Hover and keyboard-focus rings on options, and how the free-text input reads empty vs. filled."
      >
        <DCArtboard id="opt-hover"   label="Option · hover (mouse)"        width={POPUP_W} height={430}><ArtOptHover /></DCArtboard>
        <DCArtboard id="opt-focus"   label="Option · keyboard focus ring"  width={POPUP_W} height={430}><ArtOptFocus /></DCArtboard>
        <DCArtboard id="input-empty" label="Free-text input · empty"       width={POPUP_W} height={330}><ArtInputEmpty /></DCArtboard>
        <DCArtboard id="input-fill"  label="Free-text input · filled & focused"  width={POPUP_W} height={330}><ArtInputFilled /></DCArtboard>
      </DCSection>

      <DCSection
        id="affordances"
        title="Drag affordance"
        subtitle="The popup has no title bar — instead, the top row is the drag region. A four-dot handle in the center reads as a grip, brightens on hover, and the cursor changes to grab."
      >
        <DCArtboard id="drag" label="Top chrome · enlarged" width={680} height={420}><ArtDragAffordance /></DCArtboard>
      </DCSection>

      <DCSection
        id="filmstrip"
        title="Dismiss control · Esc-Esc filmstrip"
        subtitle="The dismiss button is also the keyboard legend. It mirrors the global double-Esc detector so users see their first Esc registered and see it expire if the second never arrives. ~600 ms window."
      >
        <DCArtboard id="film" label="Four states · resting → armed → done → timed out" width={760} height={420}><ArtFilmstrip /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
